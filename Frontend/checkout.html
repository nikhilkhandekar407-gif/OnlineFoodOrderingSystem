<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — TastyBite</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Tasty<span>Bite</span></a>
    <div class="ms-auto">
      <a class="nav-link cart-icon-wrap d-inline-block" href="cart.html">
        <i class="bi bi-cart3 fs-5"></i>
        <span id="cartBadge" class="badge rounded-pill bg-danger d-none">0</span>
      </a>
    </div>
  </div>
</nav>

<div class="container my-5">
  <h3 class="mb-4"><i class="bi bi-bag-check"></i> Checkout</h3>

  <div class="row g-4">
    <div class="col-md-7">
      <div class="card p-4">
        <div id="checkoutError" class="alert alert-danger d-none"></div>
        <form id="checkoutForm">
          <div class="mb-3">
            <label class="form-label">Delivery Address</label>
            <textarea class="form-control" id="deliveryAddress" rows="3" required
              placeholder="House no, street, area, city, pincode"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Contact Phone</label>
            <input type="tel" class="form-control" id="contactPhone" required pattern="[0-9]{10}"
              placeholder="10-digit mobile number">
          </div>
          <div class="mb-4">
            <label class="form-label">Payment Method</label>
            <select class="form-select" id="paymentMethod">
              <option value="Cash on Delivery">Cash on Delivery</option>
              <option value="UPI">UPI</option>
              <option value="Credit/Debit Card">Credit / Debit Card</option>
            </select>
          </div>
          <button type="submit" class="btn btn-danger w-100">Place Order</button>
        </form>
      </div>
    </div>

    <div class="col-md-5">
      <div class="card p-4">
        <h5 class="mb-3">Order Summary</h5>
        <ul class="list-group list-group-flush mb-3" id="orderSummaryList"></ul>
        <div class="d-flex justify-content-between"><span>Subtotal</span><span id="subtotalAmount">₹0.00</span></div>
        <div class="d-flex justify-content-between"><span>Delivery Fee</span><span id="deliveryFeeAmount">₹0.00</span></div>
        <hr>
        <div class="d-flex justify-content-between fw-bold fs-5"><span>Total</span><span id="grandTotalAmount">₹0.00</span></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
