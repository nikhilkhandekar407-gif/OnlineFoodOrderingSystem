<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — TastyBite</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container"><a class="navbar-brand" href="index.html">Tasty<span>Bite</span></a></div>
</nav>

<div class="card shadow-sm p-4 auth-card">
  <h4 class="mb-3 text-center">Welcome Back</h4>
  <div id="authError" class="alert alert-danger d-none"></div>
  <form onsubmit="handleLoginForm(event)">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" required>
    </div>
    <button type="submit" class="btn btn-danger w-100">Login</button>
  </form>
  <p class="text-center mt-3 mb-0">
    New here? <a href="register.html">Create an account</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
