<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — TastyBite</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Nikhils'<span>Foods</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
        <li class="nav-item"><a class="nav-link" href="index.html">Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="orders.html">My Orders</a></li>
        <li class="nav-item">
          <a class="nav-link cart-icon-wrap" href="cart.html">
            <i class="bi bi-cart3 fs-5"></i>
            <span id="cartBadge" class="badge rounded-pill bg-danger d-none">0</span>
          </a>
        </li>
        <li class="nav-item"><a class="nav-link" id="authNavLink" href="login.html">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container my-5">
  <h3 class="mb-4"><i class="bi bi-cart3"></i> Your Cart</h3>

  <p id="emptyCartMsg" class="text-muted d-none">
    Your cart is empty. <a href="index.html">Browse the menu</a> to add something tasty.
  </p>

  <div id="cartSummaryBox">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr><th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr>
        </thead>
        <tbody id="cartItemsBody"></tbody>
      </table>
    </div>

    <div class="d-flex justify-content-end">
      <div class="text-end" style="min-width:260px">
        <div class="d-flex justify-content-between fs-5 fw-bold border-top pt-3">
          <span>Total</span><span id="cartTotal">₹0.00</span>
        </div>
        <a href="checkout.html" class="btn btn-danger w-100 mt-3">Proceed to Checkout</a>
      </div>
    </div>
  </div>
</div>

<footer class="text-center">
  <div class="container"><p class="mb-0">TastyBite &copy; 2026 — Student Project (BCA)</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
